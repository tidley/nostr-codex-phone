[package]
name = "rust_lib_nostr_codex_phone"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["fips-client"]
resolver = "2"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
flutter_rust_bridge = "=2.11.1"
fips-mobile = { git = "https://github.com/tidley/fips.git", rev = "531d890a77401aaca53e2769d0dfe204387bc4a9", default-features = false, features = ["nostr-discovery"] }
fips-client = { path = "fips-client" }
futures-util = "0.3"
hound = "3.5"
libc = "0.2"
nostr = { version = "0.45.0-alpha.1", features = ["std", "os-rng", "nip59"] }
nostr-sdk = "0.45.0-alpha.1"
ogg = "0.9"
once_cell = "1"
opus = "0.3"
opus-decoder = "0.1"
qrcode = "0.14"
quinn-udp = "=0.5.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[[bin]]
name = "nostr-codex-server"
path = "src/bin/nostr_codex_server.rs"

[[bin]]
name = "nostr-keygen"
path = "src/bin/nostr_keygen.rs"

[[bin]]
name = "fips-call-harness"
path = "src/bin/fips_call_harness.rs"
