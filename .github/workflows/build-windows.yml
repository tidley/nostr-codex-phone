name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: cargo build --release --manifest-path rust/Cargo.toml
        env:
          # audiopus_sys bundles an Opus CMake project that still requests 3.5.
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
      - run: flutter build windows --release -v
        env:
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
          CARGOKIT_VERBOSE: 1
      - name: Package Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/crew-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: crew-windows-x64
          path: build/crew-windows-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/crew-windows-x64.zip
